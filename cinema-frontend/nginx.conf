server {
    listen 80;
    server_name localhost;

    # Thư mục chứa file static (khớp với COPY trong Dockerfile)
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression — tăng tốc tải trang
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── Route chính: React Router SPA ─────────────────────────────────
    # Mọi URL đều trả về index.html — React Router tự xử lý routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy to Backend API ──────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Proxy to Socket.io ────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://backend:8000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # ── Proxy to Uploads (Posters) ────────────────────────────────────
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
    }

    # ── Assets: Cache lâu vì tên file đã có hash (vd: main.abc123.js) ─
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Bảo mật cơ bản ────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Ẩn phiên bản Nginx để hạn chế thông tin rò rỉ
    server_tokens off;
}
